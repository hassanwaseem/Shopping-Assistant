<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123f35" />
  <meta name="description" content="A Pakistani meal planner with regional recipes, nutrition estimates, pantry subtraction, and an editable shopping list." />
  <title>Meal Planner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="recipe-styles.css" />
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to content</a>
  <div id="offlineBanner" class="offline-banner" role="status" hidden>Offline mode · the app remains available</div>

  <header class="app-header">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">M</div>
      <div>
        <p class="eyebrow">Our kitchen</p>
        <h1>Meal Planner</h1>
      </div>
    </div>
    <div class="header-actions">
      <span id="saveStatus" class="save-status" role="status">Saved</span>
      <button id="shareHouseholdBtn" class="button secondary compact-button" type="button">Share needed items</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="desktop-nav" aria-label="Main navigation">
      <nav id="desktopNav" class="nav-list"></nav>
    </aside>

    <main id="mainContent" tabindex="-1">
      <section id="view-today" class="app-view" data-view="today"><div class="empty-state"><h2>Loading recipes…</h2><p>Preparing the Pakistani recipe collection.</p></div></section>
      <section id="view-plan" class="app-view" data-view="plan" hidden></section>
      <section id="view-recipes" class="app-view" data-view="recipes" hidden></section>
      <section id="view-nutrition" class="app-view" data-view="nutrition" hidden></section>
      <section id="view-pantry" class="app-view" data-view="pantry" hidden></section>
      <section id="view-shop" class="app-view" data-view="shop" hidden></section>
      <section id="view-more" class="app-view" data-view="more" hidden></section>
    </main>
  </div>

  <nav id="mobileNav" class="mobile-nav" aria-label="Main navigation"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="confirmDialog" class="dialog">
    <div>
      <h2 id="dialogTitle">Confirm action</h2>
      <p id="dialogBody"></p>
      <div class="button-row end">
        <button id="dialogCancel" type="button" class="button secondary">Cancel</button>
        <button id="dialogConfirm" type="button" class="button danger">Confirm</button>
      </div>
    </div>
  </dialog>

  <dialog id="recipeDialog" class="dialog recipe-dialog">
    <div id="recipeDialogContent"></div>
  </dialog>

  <script src="planner-engine.js"></script>
  <script src="data/pakistani-recipes-adapter.js"></script>
  <script src="app/app-core.js"></script>
  <script src="app/app-views-primary.js"></script>
  <script src="app/app-views-lists.js"></script>
  <script src="app/app-views-recipes.js"></script>
  <script src="app/app-domain.js"></script>
  <script src="app/end-user-polish.js"></script>
  <script src="app/app-main.js"></script>
</body>
</html>
