<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#123f35" />
  <meta name="description" content="A practical household meal planner with nutrition, pantry subtraction, and an editable shopping list." />
  <title>Meal Planner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#mainContent">Skip to content</a>
  <div id="offlineBanner" class="offline-banner" role="status" hidden>Offline mode · changes remain on this device</div>

  <header class="app-header">
    <div class="brand-block">
      <div class="brand-mark" aria-hidden="true">M</div>
      <div>
        <p class="eyebrow">Our kitchen</p>
        <h1>Meal Planner</h1>
      </div>
    </div>
    <div class="header-actions">
      <span id="saveStatus" class="save-status" role="status">Saved locally</span>
      <button id="shareHouseholdBtn" class="button secondary compact-button" type="button">Share pantry</button>
    </div>
  </header>

  <div class="app-layout">
    <aside class="desktop-nav" aria-label="Main navigation">
      <nav id="desktopNav" class="nav-list"></nav>
      <div class="privacy-card">
        <strong>Local preview</strong>
        <p>Your data stays in this browser. Account-based collaboration requires the planned backend phase.</p>
      </div>
    </aside>

    <main id="mainContent" tabindex="-1">
      <section id="view-today" class="app-view" data-view="today"></section>
      <section id="view-plan" class="app-view" data-view="plan" hidden></section>
      <section id="view-nutrition" class="app-view" data-view="nutrition" hidden></section>
      <section id="view-pantry" class="app-view" data-view="pantry" hidden></section>
      <section id="view-shop" class="app-view" data-view="shop" hidden></section>
      <section id="view-more" class="app-view" data-view="more" hidden></section>
    </main>
  </div>

  <nav id="mobileNav" class="mobile-nav" aria-label="Main navigation"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <h2 id="dialogTitle">Confirm action</h2>
      <p id="dialogBody"></p>
      <div class="button-row end">
        <button value="cancel" class="button secondary">Cancel</button>
        <button id="dialogConfirm" value="confirm" class="button danger">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="planner-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
